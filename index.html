
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project Hail Mary — Lunar Mission</title>
<style>
* {box-sizing:border-box}
body {
  margin:0;
  background:#0b1427;
  color:#eaf4ff;
  font-family:monospace;
}
header {
  text-align:center;
  background:#14233d;
  border-bottom:4px solid #ff854f;
  padding:20px;
}
h1 {margin:0;color:#ff985f}
h2 {font-size:17px;color:#8ce9f4}
main {max-width:1200px;margin:auto;padding:16px}
.panel {
  background:#182640;
  border:3px solid #455775;
  padding:15px;
  margin-bottom:16px;
}
.resources {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(105px,1fr));
  gap:8px;
}
.resource {
  background:#293a55;
  text-align:center;
  padding:12px 5px;
  border:2px solid #566d8b;
}
.resource strong {
  display:block;
  color:#9af2c3;
  font-size:22px;
}
.game-layout {
  display:grid;
  grid-template-columns:minmax(0,2fr) minmax(250px,1fr);
  gap:15px;
}
.scene {
  position:relative;
  overflow:hidden;
  background:#555;
}
.scene>img {
  display:block;
  width:100%;
  image-rendering:pixelated;
}
.crew {
  position:absolute;
  bottom:17%;
  left:36%;
  width:8%;
  aspect-ratio:0.48;
  background-image:url("assets/astronauts.png");
  background-size:600% 200%;
  background-position:0 0;
  image-rendering:pixelated;
  animation:walk 5s ease-in-out infinite alternate;
}
.crew.second {
  left:57%;
  bottom:18%;
  background-position:40% 100%;
  animation-delay:-2s;
}
@keyframes walk {
  from {transform:translateX(-14px)}
  to {transform:translateX(14px)}
}
button {
  font:inherit;
  background:#304b6c;
  border:2px solid #6a8aaa;
  color:white;
  padding:10px;
  cursor:pointer;
}
button:hover {background:#41668c}
button:disabled {opacity:.45;cursor:not-allowed}
.buildings {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}
.buildings button {font-size:12px}
.buildings button.selected {border-color:#9af2c3}
.actions {display:flex;flex-wrap:wrap;gap:8px}
.mission {
  padding:10px;
  margin:8px 0;
  background:#283a55;
  border-left:4px solid #ff985f;
}
.complete {border-color:#9af2c3;color:#9af2c3}
#plots {
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:5px;
}
.plot {
  min-height:58px;
  background:#39455a;
  font-size:22px;
}
#log {max-height:150px;overflow:auto}
#message {color:#ffd28b;min-height:20px}
@media(max-width:750px) {
  .game-layout {grid-template-columns:1fr}
  .plot {min-height:45px}
}
</style>
</head>
<body>
<header>
<h1>🚀 PROJECT HAIL MARY</h1>
<p>8-BIT LUNAR COLONY SURVIVAL</p>
<strong id="day">MISSION DAY 1</strong>
</header>

<main>
<section class="panel">
<h2>📊 MISSION RESOURCES</h2>
<div class="resources" id="resources"></div>
</section>

<div class="game-layout">
<div>
<section class="panel">
<h2>🌕 LUNAR BASE ALPHA</h2>
<div class="scene">
  <img src="assets/moon-base.png" alt="Pixel-art lunar colony">
  <div class="crew" aria-label="Astronaut"></div>
  <div class="crew second" aria-label="Astronaut"></div>
</div>
<p>Mission crew: 2 astronauts</p>
</section>

<section class="panel">
<h2>🏗 CONSTRUCTION ZONE</h2>
<p>Select a building, then choose an empty construction tile.</p>
<div id="plots"></div>
<p id="message" aria-live="polite"></p>
<div class="actions">
<button onclick="advance()">▶ NEXT DAY</button>
<button onclick="save()">💾 SAVE</button>
<button onclick="restart()">↻ RESTART</button>
</div>
</section>

<section class="panel">
<h2>📡 MISSION LOG</h2>
<div id="log"></div>
</section>
</div>

<div>
<section class="panel">
<h2>🏗 BUILDINGS</h2>
<div id="buildings" class="buildings"></div>
</section>
<section class="panel">
<h2>🔬 RESEARCH UPGRADES</h2>
<div id="upgrades"></div>
</section>
<section class="panel">
<h2>🎯 MISSION OBJECTIVES</h2>
<div id="missions"></div>
</section>
</div>
</div>
</main>

<script>
const defs = {
 solar:{icon:"☀️",name:"Solar Array",cost:15,
        output:{power:12}},
 oxygen:{icon:"💨",name:"Oxygen Plant",cost:20,
        output:{oxygen:12,power:-4}},
 farm:{icon:"🌱",name:"Greenhouse",cost:25,
       output:{food:10,water:-3,power:-3}},
 ice:{icon:"💧",name:"Ice Extractor",cost:20,
      output:{water:10,power:-4}},
 mine:{icon:"⛏️",name:"Mineral Mine",cost:15,
       output:{minerals:9,power:-3}},
 lab:{icon:"🔬",name:"Research Lab",cost:35,
      output:{research:7,power:-5}},
 shield:{icon:"🛡️",name:"Radiation Shield",cost:30,
         output:{power:-3}}
};

const upgrades = {
 solar:{name:"Efficient Solar Cells",cost:20},
 oxygen:{name:"Oxygen Recycling",cost:25},
 farm:{name:"Hydroponics",cost:30},
 shield:{name:"Radiation Protection",cost:35}
};

const labels = {
 oxygen:"🫧 Oxygen",power:"⚡ Power",
 food:"🥔 Food",water:"💧 Water",
 minerals:"🪨 Minerals",research:"🔬 Research",
 health:"❤️ Health"
};

let game,selected="solar";

function fresh() {
 return {
  day:1,
  resources:{
   oxygen:85,power:85,food:85,water:85,
   minerals:100,research:0,health:100
  },
  plots:Array(18).fill(null),
  upgrades:[],
  log:["Lunar Base Alpha activated."],
  finished:false
 };
}

function count(type) {
 return game.plots.filter(x=>x===type).length;
}
function message(s) {
 document.getElementById("message").textContent=s;
}
function note(s) {
 game.log.unshift("Day "+game.day+": "+s);
 game.log=game.log.slice(0,20);
}
function build(i) {
 if(game.finished || game.plots[i]) return;
 const d=defs[selected],r=game.resources;
 if(r.minerals<d.cost) {
  message("Not enough minerals!");
  return;
 }
 r.minerals-=d.cost;
 game.plots[i]=selected;
 note(d.name+" constructed.");
 message("Construction completed.");
 render();
 save(false);
}
function upgrade(key) {
 if(game.finished || game.upgrades.includes(key)) return;
 const u=upgrades[key];
 if(game.resources.research<u.cost) {
  message("Not enough research points!");
  return;
 }
 game.resources.research-=u.cost;
 game.upgrades.push(key);
 note(u.name+" unlocked.");
 render();
 save(false);
}
function advance() {
 if(game.finished) return;
 const r=game.resources;
 const change={
  oxygen:-10,power:-8,food:-8,
  water:-7,minerals:0,research:0
 };
 if(game.upgrades.includes("oxygen")) change.oxygen+=4;

 for(const type of game.plots) {
  if(!type) continue;
  for(const [key,val] of Object.entries(defs[type].output)) {
   let amount=val;
   if(type==="solar" && key==="power" &&
      game.upgrades.includes("solar")) amount*=1.5;
   if(type==="farm" && key==="food" &&
      game.upgrades.includes("farm")) amount*=1.5;
   change[key]+=amount;
  }
 }

 for(const [key,value] of Object.entries(change)) {
  r[key]=Math.max(0,Math.min(999,r[key]+value));
 }

 let damage=0;
 if(r.oxygen<20) damage+=15;
 if(r.food<20) damage+=12;
 if(r.water<20) damage+=12;
 if(r.power<10) damage+=10;

 if(Math.random()<0.18) {
  const protection=count("shield")*12+
   (game.upgrades.includes("shield")?15:0);
  const exposure=Math.max(0,24-protection);
  damage+=exposure;
  note("Radiation storm! Exposure damage: "+exposure);
 }
 r.health=Math.max(0,Math.min(100,
  r.health+(damage===0?3:-damage)));

 game.day++;
 note("Daily resource cycle completed.");

 if(r.health<=0) {
  game.finished=true;
  note("MISSION FAILED: Crew health depleted.");
 } else if(game.day>=31) {
  game.finished=true;
  note("MISSION SUCCESS: 30 days survived!");
 }
 render();
 save(false);
}

function render() {
 const r=game.resources;
 document.getElementById("day").textContent=
  "MISSION DAY "+game.day;

 document.getElementById("resources").innerHTML=
  Object.entries(labels).map(([k,v])=>
   '<div class="resource">'+v+
   '<strong>'+Math.floor(r[k])+'</strong></div>'
  ).join("");

 const plots=document.getElementById("plots");
 plots.innerHTML="";
 game.plots.forEach((type,i)=>{
  const b=document.createElement("button");
  b.className="plot";
  b.textContent=type?defs[type].icon:"+";
  b.title=type?defs[type].name:"Empty construction tile";
  b.onclick=()=>build(i);
  plots.appendChild(b);
 });

 const buildings=document.getElementById("buildings");
 buildings.innerHTML="";
 Object.entries(defs).forEach(([key,d])=>{
  const b=document.createElement("button");
  b.textContent=d.icon+" "+d.name+" ("+d.cost+" minerals)";
  if(selected===key) b.classList.add("selected");
  b.onclick=()=>{selected=key;render();};
  buildings.appendChild(b);
 });

 const tech=document.getElementById("upgrades");
 tech.innerHTML="";
 Object.entries(upgrades).forEach(([key,u])=>{
  const b=document.createElement("button");
  const unlocked=game.upgrades.includes(key);
  b.textContent=u.name+" — "+
   (unlocked?"Unlocked":u.cost+" research");
  b.disabled=unlocked || game.finished;
  b.onclick=()=>upgrade(key);
  const wrapper=document.createElement("div");
  wrapper.className="mission";
  wrapper.appendChild(b);
  tech.appendChild(wrapper);
 });

 const objectives=[
  ["Establish Solar Power",count("solar")>=1],
  ["Grow Lunar Food",count("farm")>=2],
  ["Construct Research Lab",count("lab")>=1],
  ["Build Radiation Shield",count("shield")>=1],
  ["Survive 10 Days",game.day>=11 && r.health>0],
  ["Survive 30 Days",game.day>=31 && r.health>0]
 ];
 document.getElementById("missions").innerHTML=
  objectives.map(([name,done])=>
   '<div class="mission '+(done?"complete":"")+'">'+
   (done?"✓ ":"○ ")+name+"</div>"
  ).join("");

 const log=document.getElementById("log");
 log.replaceChildren();
 game.log.forEach(entry=>{
  const p=document.createElement("p");
  p.textContent=entry;
  log.appendChild(p);
 });
}

function save(show=true) {
 try {
  localStorage.setItem("hailmary-pixel-v1",
   JSON.stringify(game));
  if(show) message("Mission saved!");
 } catch(e) {
  if(show) message("Save unavailable.");
 }
}
function restart() {
 if(!confirm("Restart the lunar mission?")) return;
 game=fresh();
 render();
 save(false);
 message("New mission started.");
}
function load() {
 try {
  const saved=JSON.parse(
   localStorage.getItem("hailmary-pixel-v1"));
  if(saved && Array.isArray(saved.plots) &&
     saved.plots.length===18 && saved.resources &&
     Array.isArray(saved.upgrades) &&
     Array.isArray(saved.log)) return saved;
 } catch(e) {}
 return fresh();
}
game=load();
render();
</script>
</body>
</html>
